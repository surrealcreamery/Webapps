	gtag('js', new Date());

	gtag('config', 'G-YFQKBRHWNV');

	<body>
		<div id="error-display" style="display:none;position:fixed;top:0;left:0;right:0;z-index:99999;background:yellow;color:red;padding:20px;font-family:monospace;font-size:14px;white-space:pre-wrap;max-height:50vh;overflow:auto;border-bottom:3px solid red"></div>
		<script>
		window.addEventListener('error', function(e) {
			var el = document.getElementById('error-display');
			el.style.display = 'block';
			el.textContent = 'JS ERROR: ' + e.message + '\n' + (e.filename || '') + ':' + (e.lineno || '') + '\n' + (e.error && e.error.stack || '');
		});
		window.addEventListener('unhandledrejection', function(e) {
			var el = document.getElementById('error-display');
			el.style.display = 'block';
			el.textContent = 'PROMISE ERROR: ' + (e.reason && e.reason.message || e.reason || 'unknown') + '\n' + (e.reason && e.reason.stack || '');
		});
		</script>
		<div id="root"></div>

		<script type="module" src="/src/main.jsx"></script>
	</body>
